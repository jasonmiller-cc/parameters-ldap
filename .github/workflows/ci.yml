name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/parameters-ldap

      - name: Checkout parameters-core (replace directive)
        uses: actions/checkout@v4
        with:
          repository: jasonmiller-cc/parameters-core
          path: src/parameters-core
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: src/parameters-ldap/go.sum

      - name: Tidy
        working-directory: src/parameters-ldap
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Vet
        working-directory: src/parameters-ldap
        run: go vet ./...

      - name: Build
        working-directory: src/parameters-ldap
        run: go build -trimpath ./...

      - name: Test
        working-directory: src/parameters-ldap
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/parameters-ldap

      - name: Checkout parameters-core (replace directive)
        uses: actions/checkout@v4
        with:
          repository: jasonmiller-cc/parameters-core
          path: src/parameters-core
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: src/parameters-ldap/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: src/parameters-ldap
